    <script>
        (function() {
            'use strict';
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSnow);
            } else {
                initSnow();
            }
            function initSnow() {
                const canvas = document.createElement('canvas');
                canvas.id = 'snowCanvas';
                canvas.className = 'snow-canvas';
                document.body.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                let animationId;
                let particles = [];
                const config = {
                    maxParticles: 50, 
                    minSize: 2,
                    maxSize: 5,
                    minSpeed: 0.8,
                    maxSpeed: 2.5,
                    minOpacity: 0.4,
                    maxOpacity: 0.85,
                    windStrength: 0.4
                };
                const colors = ['#f2a603','#f2a603','#e69500','#ffb31a'];
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                class Particle {
                    constructor() {
                        this.reset();
                        this.y = Math.random() * canvas.height;
                    }
                    reset() {
                        this.x = Math.random() * canvas.width;
                        this.y = -20;
                        this.size = Math.random() * (config.maxSize - config.minSize) + config.minSize;
                        this.speed = Math.random() * (config.maxSpeed - config.minSpeed) + config.minSpeed;
                        this.opacity = Math.random() * (config.maxOpacity - config.minOpacity) + config.minOpacity;
                        this.wind = (Math.random() - 0.5) * config.windStrength;
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotationSpeed = (Math.random() - 0.5) * 0.08;
                        this.color = colors[Math.floor(Math.random() * colors.length)];
                    }
                    update() {
                        this.y += this.speed;
                        this.x += this.wind + Math.sin(this.y * 0.01) * 0.5;
                        this.rotation += this.rotationSpeed;
                        if (this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20) {
                            this.reset();
                        }
                    }
                    draw() {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.globalAlpha = this.opacity;
                        const s = this.size;
                        ctx.beginPath();
                        ctx.moveTo(0, -s);
                        ctx.bezierCurveTo(s * 0.15, -s * 0.6, s * 0.15, -s * 0.4, s * 0.5, -s * 0.15);
                        ctx.bezierCurveTo(s * 0.6, -s * 0.15, s * 0.8, -s * 0.1, s, 0);
                        ctx.bezierCurveTo(s * 0.8, s * 0.1, s * 0.6, s * 0.15, s * 0.5, s * 0.15);
                        ctx.bezierCurveTo(s * 0.15, s * 0.4, s * 0.15, s * 0.6, 0, s);
                        ctx.bezierCurveTo(-s * 0.15, s * 0.6, -s * 0.15, s * 0.4, -s * 0.5, s * 0.15);
                        ctx.bezierCurveTo(-s * 0.6, s * 0.15, -s * 0.8, s * 0.1, -s, 0);
                        ctx.bezierCurveTo(-s * 0.8, -s * 0.1, -s * 0.6, -s * 0.15, -s * 0.5, -s * 0.15);
                        ctx.bezierCurveTo(-s * 0.15, -s * 0.4, -s * 0.15, -s * 0.6, 0, -s);
                        ctx.closePath();
                        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
                        gradient.addColorStop(0, this.color);
                        gradient.addColorStop(0.7, this.color);
                        gradient.addColorStop(1, 'rgba(242, 166, 3, 0.3)');
                        ctx.fillStyle = gradient;
                        ctx.fill();
                        ctx.globalAlpha = this.opacity * 0.4;
                        ctx.beginPath();
                        ctx.arc(-s * 0.2, -s * 0.3, s * 0.15, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                        ctx.fill();
                        ctx.restore();
                    }
                }
                function createParticles() {
                    particles = [];
                    for (let i = 0; i < config.maxParticles; i++) {
                        particles.push(new Particle());
                    }
                }
                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let particle of particles) {
                        particle.update();
                        particle.draw();
                    }
                    animationId = requestAnimationFrame(animate);
                }
                function handleResize() {
                    resizeCanvas();
                    const currentParticles = particles.length;
                    if (currentParticles < config.maxParticles) {
                        for (let i = currentParticles; i < config.maxParticles; i++) {
                            particles.push(new Particle());
                        }
                    }
                }
                resizeCanvas();
                createParticles();
                animate();
                window.addEventListener('resize', handleResize);
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) {
                        cancelAnimationFrame(animationId);
                    } else {
                        animate();
                    }
                });
            }
        })();
    </script>

    <script>
        let AVATAR_URL = '';

        function setThemeBasedOnSystem() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        }
        setThemeBasedOnSystem();
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', setThemeBasedOnSystem);

        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'main') {
                document.querySelector('.tab-button').classList.add('active');
                document.getElementById('tab-main').classList.add('active');
            } else {
                document.querySelectorAll('.tab-button')[1].classList.add('active');
                document.getElementById('tab-extra').classList.add('active');
            }
        };

        window.switchSubtab = function(subtabName) {
            document.querySelectorAll('.subtab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.subtab-content').forEach(c => c.classList.remove('active'));
            if (subtabName === 'friends') {
                document.querySelectorAll('.subtab-button')[0].classList.add('active');
                document.getElementById('subtab-friends').classList.add('active');
            } else {
                document.querySelectorAll('.subtab-button')[1].classList.add('active');
                document.getElementById('subtab-girlfriends').classList.add('active');
            }
        };

        async function loadData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/MartyyyK/bio/main/data.json');
                if (!response.ok) throw new Error('Ошибка загрузки data.json');
                const data = await response.json();

                AVATAR_URL = data.avatar_url;

                document.getElementById('avatarImg').src = AVATAR_URL;

                document.getElementById('about-text').innerHTML = data.about;

                const projectsGrid = document.getElementById('projects-grid');
                projectsGrid.innerHTML = '';
                data.projects.forEach(proj => {
                    const btn = document.createElement('button');
                    btn.className = 'project-btn';
                    btn.setAttribute('data-description', proj.description);
                    btn.setAttribute('data-url', proj.url);
                    btn.innerHTML = `<i class="fab fa-telegram"></i> ${proj.name}`;
                    projectsGrid.appendChild(btn);
                });

                const friendsGrid = document.getElementById('friends-grid');
                friendsGrid.innerHTML = '';
                data.friends.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'friend-card';
                    card.setAttribute('data-name', f.name);
                    card.setAttribute('data-description', f.description);
                    card.setAttribute('data-url', f.url);

                    let avatarHtml = '';
                    if (f.avatar && f.avatar.startsWith('http')) {
                        avatarHtml = `<img src="${f.avatar}" alt="${f.name}">`;
                    } else {
                        avatarHtml = f.avatar || '👤';
                    }

                    card.innerHTML = `
                        <div class="friend-avatar">${avatarHtml}</div>
                        <div class="friend-info">
                            <h4>${f.name}</h4>
                            <a>${f.nick}</a>
                        </div>
                    `;
                    friendsGrid.appendChild(card);
                });

                const girlfriendsGrid = document.getElementById('girlfriends-grid');
                girlfriendsGrid.innerHTML = '';
                data.girlfriends.forEach(g => {
                    const card = document.createElement('div');
                    card.className = 'friend-card';
                    card.setAttribute('data-name', g.name);
                    card.setAttribute('data-description', g.description);
                    card.setAttribute('data-url', g.url);

                    let avatarHtml = '';
                    if (g.avatar && g.avatar.startsWith('http')) {
                        avatarHtml = `<img src="${g.avatar}" alt="${g.name}">`;
                    } else {
                        avatarHtml = g.avatar || '👩';
                    }

                    card.innerHTML = `
                        <div class="friend-avatar">${avatarHtml}</div>
                        <div class="friend-info">
                            <h4>${g.name}</h4>
                            <a>${g.nick}</a>
                        </div>
                    `;
                    girlfriendsGrid.appendChild(card);
                });

                attachEventHandlers();
            } catch (error) {
                document.getElementById('about-text').innerHTML = '❌ Ошибка загрузки данных. Проверьте data.json';
            } finally {
                setTimeout(() => {
                    document.getElementById('pageLoader').classList.add('hidden');
                    const card = document.getElementById('mainCard');
                    card.style.opacity = '1';
                    card.style.visibility = 'visible';
                }, 500);
            }
        }

        function attachEventHandlers() {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalDescription = document.getElementById('modalDescription');
            const gotoLink = document.getElementById('gotoLink');
            const closeBtn = document.getElementById('closeModalBtn');

            function openProjectModal(description, url) {
                modalDescription.textContent = description;
                gotoLink.href = url;
                modalOverlay.classList.add('active');
            }
            function closeProjectModal() { modalOverlay.classList.remove('active'); }

            document.querySelectorAll('.project-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    openProjectModal(btn.dataset.description, btn.dataset.url);
                });
            });

            closeBtn.onclick = closeProjectModal;
            modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeProjectModal(); };
            document.onkeydown = (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeProjectModal(); };

            const friendModalOverlay = document.getElementById('friendModalOverlay');
            const friendModalName = document.getElementById('friendModalName');
            const friendModalDescription = document.getElementById('friendModalDescription');
            const friendGotoLink = document.getElementById('friendGotoLink');
            const closeFriendBtn = document.getElementById('closeFriendModalBtn');

            function openFriendModal(name, desc, url) {
                friendModalName.textContent = name;
                friendModalDescription.textContent = desc;
                friendGotoLink.href = url;
                friendModalOverlay.classList.add('active');
            }
            function closeFriendModal() { friendModalOverlay.classList.remove('active'); }

            document.querySelectorAll('.friend-card').forEach(card => {
                card.addEventListener('click', () => {
                    openFriendModal(card.dataset.name, card.dataset.description, card.dataset.url);
                });
            });

            closeFriendBtn.onclick = closeFriendModal;
            friendModalOverlay.onclick = (e) => { if (e.target === friendModalOverlay) closeFriendModal(); };
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && friendModalOverlay.classList.contains('active')) closeFriendModal();
            });
        }

        loadData();
    </script>
</body>
</html>
